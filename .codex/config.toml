# OpenAI Codex Configuration (.codex/config.toml)

model = "gpt-6.1-sol"
personality = "pragmatic"
reasoning_effort = "high"

[sandbox]
mode = "workspace-write"
network_access = false
approval_policy = "on-risk"
allowed_commands = [
  "git status",
  "git diff",
  "git log",
  "git worktree list",
  "npm test",
  "npm run build",
  "npx tsc --noEmit"
]

[agents]
enable_subagents = true
max_concurrent_threads_per_session = 6
default_agent = "default"

[app_server]
listen = "stdio://"
http_bridge_port = 4500
experimental_api = true

[skills]
auto_select = true
directories = [".codex/skills", "~/.codex/skills"]
