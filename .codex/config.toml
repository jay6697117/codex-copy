# Project-level OpenAI Codex Configuration (.codex/config.toml)
# Note: Model and provider settings are inherited directly from your global ~/.codex/config.toml
# so your local Codex login, model (e.g. gpt-6-astra / gpt-5.4), and provider work seamlessly.

personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_summary = "detailed"
